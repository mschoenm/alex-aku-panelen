<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akupanelen woonkamer</title>
  <meta name="description" content="Probeer houten akoestische panelen uit op de tv-wand.">
  <!-- Bump ?v= on every change: GitHub Pages lets browsers cache files for 10 minutes. -->
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <header>
    <h1>Akupanelen in de woonkamer</h1>
    <p>Kies hout, vilt en hoeveel van de wand je wilt bedekken. Sleep over de foto om voor en na te vergelijken.</p>
  </header>

  <main>
    <figure class="stage" id="stage">
      <canvas id="view" aria-label="Woonkamer met akoestische panelen"></canvas>
      <div class="split" id="split" hidden><span class="tag left">Voor</span><span class="tag right">Na</span></div>
      <svg class="handles" id="handles"></svg>
      <p class="error" id="error" hidden></p>
    </figure>

    <form class="controls" id="controls" onsubmit="return false">
      <fieldset>
        <legend>Hout</legend>
        <div class="swatches" id="woods"></div>
      </fieldset>

      <fieldset>
        <legend>Vilt</legend>
        <div class="swatches" id="felts"></div>
      </fieldset>

      <fieldset>
        <legend>Afmeting</legend>
        <label class="range">Breedte <output id="widthOut"></output>
          <input type="range" id="width" min="30" max="460" step="5" value="380">
        </label>
        <label class="range">Midden <output id="centerOut"></output>
          <input type="range" id="center" min="-230" max="230" step="5" value="0">
        </label>
        <label class="range">Hoogte, vanaf de vloer <output id="heightOut"></output>
          <input type="range" id="height" min="30" max="260" step="5" value="220">
        </label>
      </fieldset>

      <fieldset>
        <legend>Latten</legend>
        <label class="range">Latbreedte <output id="slatOut"></output>
          <input type="range" id="slat" min="15" max="45" step="1" value="27">
        </label>
        <label class="range">Tussenruimte <output id="gapOut"></output>
          <input type="range" id="gap" min="6" max="25" step="1" value="13">
        </label>
        <label class="range">Belichting <output id="exposureOut"></output>
          <input type="range" id="exposure" min="60" max="140" step="1" value="100">
        </label>
      </fieldset>

      <fieldset class="actions">
        <label class="check"><input type="checkbox" id="tidy"> Opruimen</label>
        <label class="check"><input type="checkbox" id="compare" checked> Voor/na-schuif</label>
        <label class="check"><input type="checkbox" id="editCorners"> Hoeken van de wand aanpassen</label>
        <button type="button" id="resetCorners" hidden>Hoeken herstellen</button>
        <button type="button" id="download">Afbeelding opslaan</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>Een indruk, geen echte foto: de latten worden in je browser over de originele foto getekend.</p>
  </footer>

  <script src="app.js?v=12"></script>
</body>
</html>
